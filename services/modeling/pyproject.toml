[project]
name = "soundcheck-modeling"
version = "0.0.0"
description = "Fits and evaluates Soundcheck's per-audience hazard models. Reads features; never computes them."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "typer>=0.27",
]

[project.scripts]
soundcheck-modeling = "soundcheck_modeling.cli:app"

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "pytest-socket>=0.8", "ruff>=0.16"]

[build-system]
requires = ["uv_build>=0.8.5,<0.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.5"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests never touch the network; integration tests are opt-in.
addopts = ["--disable-socket", "-m", "not integration", "--strict-markers"]
markers = ["integration: needs network or cloud credentials; excluded from pnpm check"]
