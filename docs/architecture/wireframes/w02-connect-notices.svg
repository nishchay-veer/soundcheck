<text x="44" y="211.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1f1f1f" text-anchor="start">On Google's consent screen, leave both boxes ticked: viewing your YouTube account and viewing your YouTube Analytics reports.</text>
<text x="44" y="236.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Soundcheck reads your videos and how each audience watched them. Without both, it can't learn anything. Access is read-only and you can</text>
<text x="44" y="250.89999999999998" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4d4d4d" text-anchor="start">disconnect at any time.</text>
